[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialhub"
version = "0.1.3"
description = "A lightweight, PyTorch-free spatial computing and feature matching library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pankaj Kaushik" }
]
dependencies = [
    "huggingface-hub>=1.22.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.urls]
Homepage = "https://github.com/spatialhub-ai/spatialhub"
Repository = "https://github.com/spatialhub-ai/spatialhub.git"

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.19.2"]
dev = ["pytest>=9.1.1"]
render = ["pyrender>=0.1.45", "trimesh>=5.0.0", "pyopengl>=3.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/spatialhub"]

[tool.uv.workspace]
exclude = [
    "src/spatialhub/models/efficient_loftr",
    "src/spatialhub/models/depth_anything_3/DepthAnything3",
    "src/spatialhub/models/cnos/CNOS",
    "src/spatialhub/models/dinov2/DINOv2",
    "src/spatialhub/models/fastsam/FastSAM",
    "src/spatialhub/models/sam/SAM",
]

[tool.setuptools.package-data]
"spatialhub.models.cnos" = ["assets/*.npy"]

[tool.hatch.build]
exclude = [
  "**/data/",
  "**/weights/",
  "*.onnx",
  "*.pt",
  "*.pth",
  "*.bin",
  "*.jpg",
  "*.png"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring full model inference or remote weight downloads",
]

