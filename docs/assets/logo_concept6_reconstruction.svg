<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Wireframe Facet Gradients -->
    <linearGradient id="meshGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="meshGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="meshGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 3D Surface Reconstruction Triangulated Mesh -->
  <!-- Facet A (Top Crest) -->
  <polygon points="50,18 24,38 52,44" fill="url(#meshGrad1)" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Facet B (Top Right Peak) -->
  <polygon points="50,18 52,44 78,32" fill="url(#meshGrad2)" stroke="#60a5fa" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Facet C (Front Center) -->
  <polygon points="24,38 48,72 52,44" fill="url(#meshGrad3)" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Facet D (Right Slope) -->
  <polygon points="52,44 48,72 78,62" fill="url(#meshGrad1)" stroke="#2563eb" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Facet E (Far Right Crest) -->
  <polygon points="78,32 52,44 78,62" fill="url(#meshGrad2)" stroke="#60a5fa" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Keyframe Camera Frustum Observing the Reconstruction -->
  <!-- Camera Origin (16, 78) -->
  <circle cx="16" cy="80" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Projective Ray Casting through Mesh Vertices -->
  <line x1="16" y1="80" x2="24" y2="38" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.75"/>
  <line x1="16" y1="80" x2="52" y2="44" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85"/>
  <line x1="16" y1="80" x2="48" y2="72" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.75"/>

  <!-- Unprojected Point Cloud / Mesh Vertices -->
  <circle cx="50" cy="18" r="2.8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="24" cy="38" r="3" fill="#60a5fa" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="78" cy="32" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="52" cy="44" r="4.2" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/> <!-- Primary Intersection -->
  <circle cx="48" cy="72" r="3.2" fill="#60a5fa" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="78" cy="62" r="2.8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Surface Normal Vector at Primary Vertex (52, 44) -->
  <line x1="52" y1="44" x2="64" y2="28" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="64" cy="28" r="2" fill="#22c55e"/>
</svg>
