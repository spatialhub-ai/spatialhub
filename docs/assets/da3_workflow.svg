<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #94a3b8; }
      .label-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .label-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #94a3b8; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #38bdf8; }
      .label-math { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #34d399; }
      .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #fbbf24; }
      .code-purple { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #c084fc; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="460" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Title -->
  <text x="25" y="27" class="label-title">Depth Anything 3 Processing Flow</text>

  <!-- ==================== COLUMN 1: PREPROCESSING ==================== -->
  <!-- Stage 1: Dimension Resizing & Normalization (x: 25, w: 200, h: 390) -->
  <g transform="translate(25, 44)">
    <rect width="200" height="390" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="200" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">Dimension Resizing &amp; Normalization</text>

    <!-- N Views Visual Stack -->
    <g transform="translate(48, 50)">
      <rect x="20" y="0" width="70" height="52" rx="3" fill="#0b1120" stroke="#475569" stroke-width="1"/>
      <rect x="10" y="10" width="70" height="52" rx="3" fill="#0b1120" stroke="#475569" stroke-width="1"/>
      <rect x="0" y="20" width="70" height="52" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="35" y="52" class="label-body" text-anchor="middle">N Views</text>
    </g>

    <!-- 14-px patch grid illustration -->
    <g transform="translate(25, 140)">
      <rect x="0" y="0" width="150" height="42" rx="3" fill="#0b1120" stroke="#60a5fa" stroke-width="1"/>
      <line x1="30" y1="0" x2="30" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="60" y1="0" x2="60" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="90" y1="0" x2="90" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="120" y1="0" x2="120" y2="42" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="0" y1="21" x2="150" y2="21" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="75" y="26" class="label-math" text-anchor="middle">14 &#215; 14 Patch Grid</text>
    </g>

    <text x="100" y="210" class="label-body" text-anchor="middle">Input Sequence: N images</text>
    <text x="100" y="230" class="label-math" text-anchor="middle">W = 14 &#183; floor(W_tgt / 14)</text>
    <text x="100" y="248" class="label-math" text-anchor="middle">H = 14 &#183; floor(H_tgt / 14)</text>
    <text x="100" y="274" class="label-body" text-anchor="middle">ImageNet Normalization</text>
    <text x="100" y="292" class="label-dim" text-anchor="middle">&#956;=[0.485, 0.456, 0.406]</text>
    <text x="100" y="308" class="label-dim" text-anchor="middle">&#963;=[0.229, 0.224, 0.225]</text>
    <text x="100" y="336" class="label-dim" text-anchor="middle">Optional Extrinsics: (N, 4, 4)</text>
    <text x="100" y="352" class="label-dim" text-anchor="middle">Optional Intrinsics: (N, 3, 3)</text>
    <text x="100" y="374" class="label-math" text-anchor="middle">Tensors: (1, N, 3, H, W)</text>
  </g>

  <!-- Flow Arrow: Col 1 -> Col 2 -->
  <g transform="translate(238, 239)">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="8,-3 14,0 8,3" fill="#38bdf8"/>
  </g>

  <!-- ==================== COLUMN 2: ONNX INFERENCE ==================== -->
  <!-- Stage 2: ONNX Runtime Inference (x: 250, w: 180, h: 390) -->
  <g transform="translate(250, 44)">
    <rect width="180" height="390" rx="8" fill="#182234" stroke="#2563eb" stroke-width="1.2"/>
    <rect width="180" height="30" rx="8" fill="#1e3a8a" opacity="0.6"/>
    <rect y="22" width="180" height="8" fill="#1e3a8a" opacity="0.6"/>
    <text x="12" y="20" class="label-header">ONNX Runtime Inference</text>

    <!-- Session Box -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="144" height="65" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="72" y="26" class="label-header" text-anchor="middle" fill="#38bdf8">session.run()</text>
      <text x="72" y="44" class="label-body" text-anchor="middle">Single / Dual Session</text>
    </g>

    <text x="90" y="142" class="label-body" text-anchor="middle">Model Output Tensors:</text>
    
    <!-- Output Tensors list -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="140" height="24" rx="3" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="70" y="16" class="label-dim" text-anchor="middle">depth: (N, H, W)</text>

      <rect x="0" y="32" width="140" height="24" rx="3" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="70" y="48" class="label-dim" text-anchor="middle">conf: (N, H, W)</text>

      <rect x="0" y="64" width="140" height="24" rx="3" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="70" y="80" class="code-amber" text-anchor="middle">sky: (N, H, W)</text>

      <rect x="0" y="96" width="140" height="24" rx="3" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="70" y="112" class="label-math" text-anchor="middle">pred_ext: (N, 4, 4)</text>

      <rect x="0" y="128" width="140" height="24" rx="3" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="70" y="144" class="label-math" text-anchor="middle">pred_int: (N, 3, 3)</text>
    </g>

    <text x="90" y="345" class="label-body" text-anchor="middle">Sky Suppression</text>
    <text x="90" y="365" class="label-math" text-anchor="middle">depth[sky] = max_depth</text>
  </g>

  <!-- Flow Branches: Col 2 -> Col 3 -->
  <!-- Branch to Relative (y: 110) -->
  <path d="M 430 200 L 450 200 L 450 110 L 470 110" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="470,107 476,110 470,113" fill="#38bdf8"/>

  <!-- Branch to Metric (y: 239) -->
  <path d="M 430 239 L 470 239" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <polygon points="470,236 476,239 470,242" fill="#34d399"/>

  <!-- Branch to Nested (y: 368) -->
  <path d="M 430 280 L 450 280 L 450 368 L 470 368" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <polygon points="470,365 476,368 470,371" fill="#c084fc"/>

  <!-- ==================== COLUMN 3: MODEL PRESETS & SCALE ALIGNMENT ==================== -->
  <!-- Container for Model Presets (x: 476, w: 220) -->
  <g transform="translate(476, 44)">
    <!-- Sub-card 1: Any-View & Mono Relative Models (h: 118) -->
    <rect width="220" height="118" rx="6" fill="#182234" stroke="#38bdf8" stroke-width="1"/>
    <rect width="220" height="24" rx="6" fill="#1e293b"/>
    <rect y="16" width="220" height="8" fill="#1e293b"/>
    <text x="10" y="16" class="label-header">Any-View &amp; Mono Presets</text>
    <text x="12" y="38" class="label-dim">da3_small, base, large, giant</text>
    <text x="12" y="54" class="label-body">Relative inverse depth (unscaled)</text>
    <text x="12" y="72" class="code-amber">da3mono_large: relative + sky mask</text>
    <text x="12" y="90" class="label-math">is_metric = False</text>
    <text x="12" y="106" class="label-dim">depth_type = "relative"</text>

    <!-- Sub-card 2: Metric Model (y: 130, h: 118) -->
    <g transform="translate(0, 130)">
      <rect width="220" height="118" rx="6" fill="#182234" stroke="#34d399" stroke-width="1"/>
      <rect width="220" height="24" rx="6" fill="#064e3b" opacity="0.6"/>
      <rect y="16" width="220" height="8" fill="#064e3b" opacity="0.6"/>
      <text x="10" y="16" class="label-header">Metric Depth Preset</text>
      <text x="12" y="38" class="label-dim">da3metric_large</text>
      <text x="12" y="54" class="label-body">Absolute metric depth in meters</text>
      <text x="12" y="72" class="label-math">Canonical focal scaling: f / 300</text>
      <text x="12" y="90" class="label-math">is_metric = True</text>
      <text x="12" y="106" class="label-dim">depth_type = "metric"</text>
    </g>

    <!-- Sub-card 3: Nested Dual-Model (y: 260, h: 130) -->
    <g transform="translate(0, 260)">
      <rect width="220" height="130" rx="6" fill="#182234" stroke="#c084fc" stroke-width="1"/>
      <rect width="220" height="24" rx="6" fill="#581c87" opacity="0.6"/>
      <rect y="16" width="220" height="8" fill="#581c87" opacity="0.6"/>
      <text x="10" y="16" class="label-header">Nested Dual-Model Presets</text>
      <text x="12" y="38" class="code-purple">da3nested_*_large</text>
      <text x="12" y="54" class="label-body">align_nested_depth_np()</text>
      <text x="12" y="72" class="label-math">&#937; = {conf &gt; &#964; &#8743; sky &lt; 0.3}</text>
      <text x="12" y="90" class="label-math">s* = argmin &#8721; (s&#183;D_rel - D_metric)&#178;</text>
      <text x="12" y="106" class="label-math">depth = s* &#183; D_rel</text>
      <text x="12" y="122" class="label-dim">is_metric = True</text>
    </g>
  </g>

  <!-- Flow Converge: Col 3 -> Col 4 -->
  <path d="M 696 103 L 720 103 L 720 239 L 735 239" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 696 239 L 735 239" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <path d="M 696 375 L 720 375 L 720 239 L 735 239" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <polygon points="735,236 741,239 735,242" fill="#38bdf8"/>

  <!-- ==================== COLUMN 4: EXTRINSICS ALIGNMENT ==================== -->
  <!-- Container for Alignment (x: 741, w: 245, h: 390) -->
  <g transform="translate(741, 44)">
    <rect width="245" height="390" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="245" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="245" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">Extrinsics Alignment</text>

    <!-- Branch A: Unposed (extrinsics = None) -->
    <g transform="translate(10, 38)">
      <rect width="225" height="72" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <text x="8" y="16" class="label-header" fill="#38bdf8">Unposed (extrinsics = None)</text>
      <text x="8" y="32" class="label-body">Decoder estimates relative extrinsics</text>
      <text x="8" y="48" class="label-math">T_aligned = pred_ext (canonical)</text>
      <text x="8" y="64" class="label-dim">Uncalibrated: estimates intrinsics</text>
    </g>

    <!-- Branch B: Single-View Posed (N=1) -->
    <g transform="translate(10, 118)">
      <rect width="225" height="60" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="8" y="16" class="label-header">Posed Single-View (N = 1)</text>
      <text x="8" y="32" class="label-body">Direct adoption of input world pose</text>
      <text x="8" y="48" class="label-math">T_aligned = orig_ext (no scaling)</text>
    </g>

    <!-- Branch C: Two-View Baseline Ratio (N=2) -->
    <g transform="translate(10, 186)">
      <rect width="225" height="74" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="8" y="16" class="label-header">Posed Two-View (N = 2)</text>
      <text x="8" y="32" class="label-body">Baseline distance ratio scaling:</text>
      <text x="8" y="48" class="label-math">s = ||&#916;C_pred|| / ||&#916;C_gt||</text>
      <text x="8" y="64" class="label-math">depth = depth / s, T = orig_ext</text>
    </g>

    <!-- Branch D: Multi-View Umeyama (N >= 3) -->
    <g transform="translate(10, 268)">
      <rect width="225" height="110" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
      <text x="8" y="16" class="label-header" fill="#34d399">Posed Multi-View (N &#8805; 3)</text>
      <text x="8" y="32" class="label-body">align_poses_umeyama() Sim(3):</text>
      <text x="8" y="48" class="label-math">min ||s*&#183;R&#183;C_pred + t - C_ref||&#178;</text>
      <text x="8" y="64" class="label-math">depth = depth / s*</text>
      <text x="8" y="80" class="code-amber">RANSAC outlier filtering if N &#8805; 10</text>
      <text x="8" y="96" class="label-dim">T_aligned = orig_ext</text>
    </g>
  </g>

  <!-- Flow Arrow: Col 4 -> Col 5 -->
  <g transform="translate(994, 239)">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="8,-3 14,0 8,3" fill="#38bdf8"/>
  </g>

  <!-- ==================== COLUMN 5: OUTPUT DATACLASS ==================== -->
  <!-- Stage 5: Output Contract (x: 1008, w: 167, h: 390) -->
  <g transform="translate(1008, 44)">
    <rect width="167" height="390" rx="8" fill="#182234" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="167" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="167" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">Output Data Contract</text>

    <!-- Dataclass box -->
    <g transform="translate(12, 46)">
      <rect width="143" height="28" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <text x="71" y="18" class="label-dim" text-anchor="middle">DepthMap</text>
    </g>

    <!-- Field Descriptions -->
    <g transform="translate(14, 94)">
      <text x="0" y="0" class="label-header" fill="#f8fafc">Fields:</text>

      <text x="0" y="22" class="label-dim">&#8226; depth</text>
      <text x="10" y="36" class="label-body">(N, H, W) float32</text>

      <text x="0" y="60" class="label-dim">&#8226; confidence</text>
      <text x="10" y="74" class="label-body">(N, H, W) in [0, 1]</text>

      <text x="0" y="98" class="label-dim">&#8226; depth_type</text>
      <text x="10" y="112" class="code-amber">"metric" | "relative"</text>

      <text x="0" y="136" class="label-dim">&#8226; intrinsics</text>
      <text x="10" y="150" class="label-body">(N, 3, 3) float32</text>

      <text x="0" y="174" class="label-dim">&#8226; extrinsics</text>
      <text x="10" y="188" class="label-body">(N, 4, 4) float32</text>
    </g>

    <text x="83" y="330" class="label-math" text-anchor="middle">Downstream Vision</text>
    <text x="83" y="348" class="label-body" text-anchor="middle">3D Reconstruction</text>
    <text x="83" y="364" class="label-body" text-anchor="middle">Surface Normal Est.</text>
    <text x="83" y="380" class="label-dim" text-anchor="middle">Point Cloud Reprojection</text>
  </g>
</svg>
