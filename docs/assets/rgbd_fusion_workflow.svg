<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" width="100%" height="100%">
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #94a3b8; }
      .label-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .label-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #94a3b8; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #38bdf8; }
      .label-math { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #34d399; }
      .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #fbbf24; }
    </style>
    <linearGradient id="depthGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="depthGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1180" height="270" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Architecture Title -->
  <text x="25" y="27" class="label-title">RGB-D Scene Fusion Architecture</text>

  <!-- Card 1: Calibrated RGB-D Inputs (x: 25, w: 240) -->
  <g transform="translate(25, 44)">
    <rect width="240" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="240" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="240" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Calibrated RGB-D Inputs</text>

    <!-- Visual: Layered RGB & Depth Frame Cards -->
    <g transform="translate(18, 44)">
      <!-- View A Stack -->
      <g transform="translate(0, 0)">
        <!-- Depth underlay -->
        <rect x="6" y="6" width="76" height="48" rx="4" fill="url(#depthGradA)" stroke="#475569" stroke-width="1"/>
        <!-- RGB overlay -->
        <rect x="0" y="0" width="76" height="48" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="22" cy="18" r="6" fill="#0284c7" fill-opacity="0.4"/>
        <path d="M 10 38 L 28 22 L 46 36 L 66 20 L 76 30 L 76 46 L 0 46 L 0 32 Z" fill="#0369a1" fill-opacity="0.35"/>
        <text x="38" y="27" class="label-body" text-anchor="middle" font-weight="600" fill="#f8fafc">View A</text>
        <text x="38" y="66" class="label-dim" text-anchor="middle">RGB + Depth</text>
      </g>

      <!-- View B Stack -->
      <g transform="translate(118, 0)">
        <rect x="6" y="6" width="76" height="48" rx="4" fill="url(#depthGradB)" stroke="#475569" stroke-width="1"/>
        <rect x="0" y="0" width="76" height="48" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="22" cy="18" r="6" fill="#0284c7" fill-opacity="0.4"/>
        <path d="M 10 38 L 28 22 L 46 36 L 66 20 L 76 30 L 76 46 L 0 46 L 0 32 Z" fill="#0369a1" fill-opacity="0.35"/>
        <text x="38" y="27" class="label-body" text-anchor="middle" font-weight="600" fill="#f8fafc">View B</text>
        <text x="38" y="66" class="label-dim" text-anchor="middle">RGB + Depth</text>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; View A &amp; B: (H, W, 3) RGB</text>
    <text x="20" y="162" class="label-dim">&#8226; Sensor Depth: (H, W) in meters</text>
    <text x="20" y="182" class="label-math">&#8226; Camera Intrinsics: K &#8712; &#8477;^(3&#215;3)</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(282, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 2: Correspondence Lifting (x: 300, w: 260) -->
  <g transform="translate(300, 44)">
    <rect width="260" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="260" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="260" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Correspondence Lifting</text>

    <!-- Visual: 2D Keypoint Matching to 3D Ray Lifting -->
    <g transform="translate(16, 44)">
      <!-- Mini Frame A -->
      <rect x="0" y="4" width="60" height="42" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="18" cy="20" r="2.5" fill="#38bdf8"/>
      <circle cx="42" cy="30" r="2.5" fill="#38bdf8"/>
      <text x="30" y="58" class="label-body" text-anchor="middle">Image A</text>

      <!-- Mini Frame B -->
      <rect x="94" y="4" width="60" height="42" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="110" cy="18" r="2.5" fill="#38bdf8"/>
      <circle cx="138" cy="28" r="2.5" fill="#38bdf8"/>
      <text x="124" y="58" class="label-body" text-anchor="middle">Image B</text>

      <!-- 2D Match Lines -->
      <line x1="18" y1="20" x2="110" y2="18" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="2,2"/>
      <line x1="42" y1="30" x2="138" y2="28" stroke="#22c55e" stroke-width="1.2"/>

      <!-- 3D Ray Lifting Graphic -->
      <g transform="translate(168, 6)">
        <path d="M 0 32 L 40 10 L 52 38 Z" fill="#0369a1" fill-opacity="0.2" stroke="#475569" stroke-width="1"/>
        <line x1="0" y1="32" x2="38" y2="14" stroke="#fbbf24" stroke-width="1.5"/>
        <circle cx="38" cy="14" r="3" fill="#34d399"/>
        <text x="46" y="12" class="code-amber">X_A</text>
        <text x="26" y="50" class="label-body" text-anchor="middle">3D Point</text>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; EfficientLoFTR: (N, 2) 2D Matches</text>
    <text x="20" y="162" class="label-dim">&#8226; Depth Sampling: Z_A = Depth_A(u, v)</text>
    <text x="20" y="182" class="label-math">&#8226; 3D Lifting: X_A = K^-1 [u, v, 1]^T &#183; Z_A</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(577, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 3: 3D-to-2D PnP RANSAC (x: 595, w: 265) -->
  <g transform="translate(595, 44)">
    <rect width="265" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="265" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="265" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">3D-to-2D PnP RANSAC</text>

    <!-- Visual: 3D-to-2D Reprojection Cone and SE(3) Transform -->
    <g transform="translate(20, 44)">
      <!-- Coordinate Frame A -->
      <g transform="translate(24, 38)">
        <line x1="0" y1="0" x2="26" y2="0" stroke="#f43f5e" stroke-width="1.8"/>
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#22c55e" stroke-width="1.8"/>
        <line x1="0" y1="0" x2="-14" y2="14" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="30" y="4" class="label-body" fill="#f43f5e">X</text>
        <text x="-4" y="-30" class="label-body" fill="#22c55e">Y</text>
        <text x="-22" y="20" class="label-body" fill="#38bdf8">Z</text>
        <text x="2" y="16" class="label-body">Cam A</text>
      </g>

      <!-- Transformation Arc [R | t] -->
      <path d="M 60 18 Q 105 -2 145 18" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3,2"/>
      <polygon points="145,18 136,12 140,21" fill="#fbbf24"/>
      <text x="105" y="8" class="code-amber" text-anchor="middle">[R | t]</text>

      <!-- Frame B Image Plane with Reprojection -->
      <g transform="translate(155, 6)">
        <rect x="0" y="0" width="56" height="42" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="16" cy="18" r="3" fill="#22c55e"/>
        <circle cx="38" cy="24" r="3" fill="#22c55e"/>
        <circle cx="46" cy="10" r="2.5" fill="#ef4444"/>
        <text x="28" y="52" class="label-body" text-anchor="middle">Inlier Reproj</text>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; solve_pnp_ransac: (N, 3) &#8594; (N, 2)</text>
    <text x="20" y="162" class="label-dim">&#8226; Consensus: Geometric Inlier Set</text>
    <text x="20" y="182" class="label-math">&#8226; Metric Pose: T = [R | t] &#8712; SE(3)</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(877, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 4: Dense Scene Fusion (x: 895, w: 260) -->
  <g transform="translate(895, 44)">
    <rect width="260" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="260" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="260" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Dense Scene Fusion</text>

    <!-- Visual: 3D Point Cloud Bounding Box & Merged Surfaces -->
    <g transform="translate(20, 42)">
      <!-- Isometric Bounding Box Cage -->
      <g stroke="#475569" stroke-width="1" fill="none" opacity="0.6">
        <path d="M 30 18 L 130 18 L 170 38 L 70 38 Z"/>
        <path d="M 30 58 L 130 58 L 170 78 L 70 78 Z"/>
        <line x1="30" y1="18" x2="30" y2="58"/>
        <line x1="130" y1="18" x2="130" y2="58"/>
        <line x1="170" y1="38" x2="170" y2="78"/>
        <line x1="70" y1="38" x2="70" y2="78"/>
      </g>

      <!-- Fused Point Cloud Clusters (Dense Points) -->
      <g opacity="0.9">
        <!-- View A points (Cyan) -->
        <circle cx="58" cy="38" r="1.5" fill="#38bdf8"/>
        <circle cx="72" cy="34" r="1.5" fill="#38bdf8"/>
        <circle cx="85" cy="42" r="1.5" fill="#38bdf8"/>
        <circle cx="68" cy="50" r="1.5" fill="#38bdf8"/>
        <circle cx="95" cy="46" r="1.5" fill="#38bdf8"/>
        <circle cx="80" cy="56" r="1.5" fill="#38bdf8"/>
        <!-- View B points (Green) -->
        <circle cx="108" cy="40" r="1.5" fill="#34d399"/>
        <circle cx="122" cy="48" r="1.5" fill="#34d399"/>
        <circle cx="135" cy="42" r="1.5" fill="#34d399"/>
        <circle cx="115" cy="54" r="1.5" fill="#34d399"/>
        <circle cx="140" cy="58" r="1.5" fill="#34d399"/>
        <circle cx="128" cy="62" r="1.5" fill="#34d399"/>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; Dense Reprojection: K^-1 &#183; Depth</text>
    <text x="20" y="162" class="label-dim">&#8226; Coordinate Alignment: X_B = R X_A + t</text>
    <text x="20" y="182" class="label-math">&#8226; Output: (M, 3) Fused PLY Model</text>
  </g>
</svg>