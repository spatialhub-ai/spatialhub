<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favHub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Clean Hexagonal Graph Edges -->
  <polygon points="16,4 27,10 27,22 16,28 5,22 5,10" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>

  <!-- Radiating Spoke Lines -->
  <line x1="16" y1="4" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="27" y1="10" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="27" y1="22" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="16" y1="28" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="5" y1="22" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="5" y1="10" x2="16" y2="16" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Satellite Vertices -->
  <circle cx="16" cy="4" r="1.8" fill="#38bdf8"/>
  <circle cx="27" cy="10" r="1.8" fill="#3b82f6"/>
  <circle cx="27" cy="22" r="1.8" fill="#22c55e"/>
  <circle cx="16" cy="28" r="1.8" fill="#1d4ed8"/>
  <circle cx="5" cy="22" r="1.8" fill="#6366f1"/>
  <circle cx="5" cy="10" r="1.8" fill="#0284c7"/>

  <!-- Center Hub Reticle -->
  <circle cx="16" cy="16" r="4.2" fill="url(#favHub)" stroke="#ffffff" stroke-width="1"/>
  <circle cx="16" cy="16" r="1.2" fill="#ef4444"/>
</svg>
