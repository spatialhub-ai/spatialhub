<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Spatial Node Gradient with higher brightness and contrast -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background Epipolar Constraint & Co-visibility Graph Edges (Solid Crisp Lines) -->
  <line x1="22" y1="32" x2="50" y2="16" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="50" y1="16" x2="78" y2="32" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="78" y1="32" x2="78" y2="68" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="78" y1="68" x2="50" y2="84" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="50" y1="84" x2="22" y2="68" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="22" y1="68" x2="22" y2="32" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Core Graph Connections radiating to Center Hub (Higher stroke & contrast) -->
  <line x1="22" y1="32" x2="50" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="16" x2="50" y2="50" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="32" x2="50" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="68" x2="50" y2="50" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="84" x2="50" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="68" x2="50" y2="50" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Satellite Nodes with crisp thick white borders for high visibility on any background -->
  <!-- Top Node (RGB Camera) -->
  <circle cx="50" cy="16" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Top Left Node (Depth Sensor) -->
  <circle cx="22" cy="32" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Top Right Node (Pose Keyframe) -->
  <circle cx="78" cy="32" r="6" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Bottom Right Node (3D Landmark Map) -->
  <circle cx="78" cy="68" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Bottom Node (CAD / Mesh Model) -->
  <circle cx="50" cy="84" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Bottom Left Node (Optical Flow / Keypoint Match) -->
  <circle cx="22" cy="68" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Center Hub: Spatial Optimization Engine -->
  <circle cx="50" cy="50" r="13" fill="url(#hubGrad)" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Inscribed High-Contrast Reticle / Crosshair -->
  <line x1="50" y1="42" x2="50" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="58" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
</svg>
