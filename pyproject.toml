[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spatialhub"
dynamic = ["version"]
description = "Zero-PyTorch Python library for composing deep vision models and geometric algorithms into spatial perception pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pankaj Kaushik", email = "pankajkaushik12r@gmail.com" }
]
dependencies = [
    "huggingface-hub>=1.22.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.urls]
Homepage = "https://spatialhub-ai.github.io/spatialhub/"
Documentation = "https://spatialhub-ai.github.io/spatialhub/"
Repository = "https://github.com/spatialhub-ai/spatialhub.git"

[project.optional-dependencies]
cpu = ["onnxruntime>=1.19.0"]
gpu = ["onnxruntime-gpu>=1.19.0"]
render = [
    "trimesh>=5.0.0", 
    "scipy>=1.13.0",
    "moderngl>=5.12.0",
    "pillow>=10.0.0",
]


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spatialhub/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialhub"]
exclude = [
  "**/.cache",
  "**/debug",
  "*.onnx",
  "*.onnx.data",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/upstream",
  "/tools",
  "/benchmark",
  "/site",
  "/dist",
  "**/.cache",
  "**/debug",
  "*.onnx",
  "*.onnx.data",
]


[tool.uv.workspace]
exclude = [
    "upstream/efficient_loftr",
    "upstream/depth_anything_3",
    "upstream/cnos",
    "upstream/foundationpose",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "twine>=6.2.0",
]
docs = [
    "jinja2>=3.1.5",
    "markupsafe>=3.0.2",
    "mkdocs-material>=9.7.7", 
    "mkdocstrings[python]>=1.0.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring full model inference or remote weight downloads",
]

