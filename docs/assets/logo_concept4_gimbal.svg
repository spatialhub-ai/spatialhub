<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Outer Spatial Horizon Rings (Representing SE(3) Sphere / Pose Space) -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>
  <ellipse cx="50" cy="50" rx="16" ry="38" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Inscribed 3D Coordinate Gimbal / Pose Reticle -->
  <!-- Z (Forward / Depth): Blue -->
  <line x1="50" y1="50" x2="50" y2="16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <!-- X (Right): Red -->
  <line x1="50" y1="50" x2="80" y2="50" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Y (Down): Green -->
  <line x1="50" y1="50" x2="32" y2="72" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

  <!-- Optical Center Core -->
  <circle cx="50" cy="50" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>

  <!-- Satellite Pose Vectors -->
  <circle cx="50" cy="16" r="3" fill="#2563eb"/>
  <circle cx="80" cy="50" r="3" fill="#ef4444"/>
  <circle cx="32" cy="72" r="3" fill="#22c55e"/>

  <!-- Triangulation / Epipolar Ray -->
  <line x1="50" y1="16" x2="80" y2="50" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8"/>
</svg>
