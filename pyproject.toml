[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialhub"
version = "0.1.5"
description = "High-performance, zero-PyTorch spatial AI and perception library with unified ONNX Runtime inference."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pankaj Kaushik" }
]
dependencies = [
    "huggingface-hub>=1.22.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.urls]
Homepage = "https://spatialhub-ai.github.io/spatialhub/"
Documentation = "https://spatialhub-ai.github.io/spatialhub/"
Repository = "https://github.com/spatialhub-ai/spatialhub.git"

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.19.2"]
render = [
    "pyrender>=0.1.45", 
    "trimesh>=5.0.0", 
    "pyopengl>=3.1.0", 
    "moderngl>=5.12.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatialhub"]
exclude = [
  "**/demo_data",
  "**/demo_data/**",
  "**/debug",
  "**/debug/**",
  "**/data",
  "**/data/**",
  "**/weights",
  "**/weights/**",
  "**/media/**",
  "**/logs",
  "**/logs/**",
  "**/out",
  "**/outputs/**",
  "**/out/**",
  "*.ckpt",
  "*.onnx",
  "*.onnx.data",
  "*.pt",
  "*.pth",
  "*.bin",
  "*.jpg",
  "*.jpeg",
  "*.png",
  "*.mp4",
  "*.gif",
  "*.zip",
  "*.tar",
  "*.tar.gz"
]

[tool.hatch.build.targets.sdist]
exclude = [
  "**/demo_data",
  "**/demo_data/**",
  "**/debug",
  "**/debug/**",
  "**/data",
  "**/data/**",
  "**/weights",
  "**/weights/**",
  "**/logs",
  "**/logs/**",
  "**/out",
  "**/out/**",
  "*.ckpt",
  "*.onnx",
  "*.onnx.data",
  "*.pt",
  "*.pth",
  "*.bin",
  "*.jpg",
  "*.jpeg",
  "*.png",
  "*.mp4",
  "*.gif",
  "*.zip",
  "*.tar",
  "*.tar.gz"
]

[tool.uv.workspace]
exclude = [
    "src/spatialhub/models/efficient_loftr",
    "src/spatialhub/models/depth_anything_3/DepthAnything3",
    "src/spatialhub/models/cnos/CNOS",
    "src/spatialhub/models/dinov2/DINOv2",
    "src/spatialhub/models/fastsam/FastSAM",
    "src/spatialhub/models/sam/SAM",
    "src/spatialhub/models/foundationpose/FoundationPose",
]

[tool.setuptools.package-data]
"spatialhub.models.cnos" = ["assets/*.npy"]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "twine>=6.2.0",
]
docs = [
    "jinja2>=3.1.5",
    "markupsafe>=3.0.2",
    "mkdocs-material>=9.7.7", 
    "mkdocstrings[python]>=1.0.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring full model inference or remote weight downloads",
]

