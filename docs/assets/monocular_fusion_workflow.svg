<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" width="100%" height="100%">
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #94a3b8; }
      .label-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; }
      .label-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #94a3b8; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #38bdf8; }
      .label-math { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #34d399; }
      .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #fbbf24; }
    </style>
    <linearGradient id="da3GradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="da3GradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1180" height="270" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Architecture Title -->
  <text x="25" y="27" class="label-title">Monocular Scene Fusion Architecture</text>

  <!-- Card 1: Monocular RGB Pair (x: 25, w: 240) -->
  <g transform="translate(25, 44)">
    <rect width="240" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="240" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="240" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Monocular RGB Pair</text>

    <!-- Visual: Dual Camera Frustums with No Sensor Depth -->
    <g transform="translate(18, 44)">
      <!-- View A Frustum & Plane -->
      <g transform="translate(0, 0)">
        <polygon points="12,38 0,44 0,32" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
        <line x1="12" y1="38" x2="30" y2="10" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="12" y1="38" x2="30" y2="46" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
        <rect x="30" y="6" width="56" height="42" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="48" cy="22" r="5" fill="#0284c7" fill-opacity="0.4"/>
        <path d="M 36 38 L 48 26 L 62 36 L 76 24 L 86 32 L 86 44 L 30 44 Z" fill="#0369a1" fill-opacity="0.35"/>
        <text x="58" y="28" class="label-body" text-anchor="middle" font-weight="600" fill="#f8fafc">View A</text>
        <text x="58" y="64" class="label-dim" text-anchor="middle">RGB (H, W, 3)</text>
      </g>

      <!-- View B Frustum & Plane -->
      <g transform="translate(112, 0)">
        <polygon points="12,38 0,44 0,32" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
        <line x1="12" y1="38" x2="30" y2="10" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="12" y1="38" x2="30" y2="46" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
        <rect x="30" y="6" width="56" height="42" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="48" cy="22" r="5" fill="#0284c7" fill-opacity="0.4"/>
        <path d="M 36 38 L 48 26 L 62 36 L 76 24 L 86 32 L 86 44 L 30 44 Z" fill="#0369a1" fill-opacity="0.35"/>
        <text x="58" y="28" class="label-body" text-anchor="middle" font-weight="600" fill="#f8fafc">View B</text>
        <text x="58" y="64" class="label-dim" text-anchor="middle">RGB (H, W, 3)</text>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; View A &amp; B: Pure 2D Color Frames</text>
    <text x="20" y="162" class="label-dim">&#8226; Zero Active Sensor Depth Hardware</text>
    <text x="20" y="182" class="label-math">&#8226; Camera Intrinsics: K &#8712; &#8477;^(3&#215;3)</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(282, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 2: Essential Matrix RANSAC (x: 300, w: 260) -->
  <g transform="translate(300, 44)">
    <rect width="260" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="260" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="260" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Essential Matrix RANSAC</text>

    <!-- Visual: Epipolar Geometry & Unit Translation -->
    <g transform="translate(22, 44)">
      <!-- Baseline Vector -->
      <line x1="20" y1="50" x2="160" y2="50" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3,2"/>
      <polygon points="160,50 152,46 152,54" fill="#fbbf24"/>
      <text x="90" y="64" class="code-amber" text-anchor="middle">t_unit (||t|| = 1)</text>

      <!-- Camera Centers -->
      <circle cx="20" cy="50" r="4" fill="#38bdf8"/>
      <text x="20" y="72" class="label-body" text-anchor="middle">C_A</text>
      <circle cx="160" cy="50" r="4" fill="#38bdf8"/>
      <text x="160" y="72" class="label-body" text-anchor="middle">C_B</text>

      <!-- Epipolar Triangle / Plane -->
      <polygon points="20,50 90,12 160,50" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="90" cy="12" r="3" fill="#34d399"/>
      <text x="90" y="4" class="label-math" text-anchor="middle">X (3D Point)</text>

      <!-- Epipolar Lines on Image Planes -->
      <line x1="42" y1="36" x2="52" y2="24" stroke="#22c55e" stroke-width="1.5"/>
      <line x1="128" y1="36" x2="138" y2="24" stroke="#22c55e" stroke-width="1.5"/>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; EfficientLoFTR: (N, 2) Keypoints</text>
    <text x="20" y="162" class="label-dim">&#8226; 5-Point Essential Matrix: E = [t]&#215; R</text>
    <text x="20" y="182" class="label-math">&#8226; Orientation: R &#8712; SO(3), ||t_unit|| = 1.0</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(577, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 3: Depth & Scale Alignment (x: 595, w: 265) -->
  <g transform="translate(595, 44)">
    <rect width="265" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="265" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="265" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Depth &amp; Scale Alignment</text>

    <!-- Visual: Depth Maps & Residual Projection for Scale -->
    <g transform="translate(20, 44)">
      <!-- DA3 Depth Card A -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="58" height="42" rx="3" fill="url(#da3GradA)" stroke="#475569" stroke-width="1"/>
        <text x="29" y="54" class="label-body" text-anchor="middle">DA3 Depth A</text>
      </g>

      <!-- Scale Projection Arrow -->
      <g transform="translate(86, 20)">
        <line x1="0" y1="0" x2="34" y2="0" stroke="#fbbf24" stroke-width="1.5"/>
        <polygon points="34,0 26,-4 26,4" fill="#fbbf24"/>
        <text x="17" y="-8" class="code-amber" text-anchor="middle">&#955; Scale</text>
      </g>

      <!-- DA3 Depth Card B -->
      <g transform="translate(138, 0)">
        <rect x="0" y="0" width="58" height="42" rx="3" fill="url(#da3GradB)" stroke="#475569" stroke-width="1"/>
        <text x="29" y="54" class="label-body" text-anchor="middle">DA3 Depth B</text>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; DepthAnything3: Metric Depth Maps</text>
    <text x="20" y="162" class="label-dim">&#8226; Scale Alignment: &#955; = median(residual &#183; t)</text>
    <text x="20" y="182" class="label-math">&#8226; Metric Pose: T = [R | &#955; &#183; t_unit] &#8712; SE(3)</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(877, 145)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="12,-3 18,0 12,3" fill="#38bdf8"/>
  </g>

  <!-- Card 4: Dense Scene Fusion (x: 895, w: 260) -->
  <g transform="translate(895, 44)">
    <rect width="260" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="260" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="260" height="8" fill="#1e293b"/>
    <text x="14" y="20" class="label-header">Dense Scene Fusion</text>

    <!-- Visual: 3D Point Cloud Bounding Box & Merged Surfaces -->
    <g transform="translate(20, 42)">
      <!-- Isometric Bounding Box Cage -->
      <g stroke="#475569" stroke-width="1" fill="none" opacity="0.6">
        <path d="M 30 18 L 130 18 L 170 38 L 70 38 Z"/>
        <path d="M 30 58 L 130 58 L 170 78 L 70 78 Z"/>
        <line x1="30" y1="18" x2="30" y2="58"/>
        <line x1="130" y1="18" x2="130" y2="58"/>
        <line x1="170" y1="38" x2="170" y2="78"/>
        <line x1="70" y1="38" x2="70" y2="78"/>
      </g>

      <!-- Fused Point Cloud Clusters (Dense Points) -->
      <g opacity="0.9">
        <!-- View A points (Purple/Magenta) -->
        <circle cx="58" cy="38" r="1.5" fill="#c026d3"/>
        <circle cx="72" cy="34" r="1.5" fill="#c026d3"/>
        <circle cx="85" cy="42" r="1.5" fill="#c026d3"/>
        <circle cx="68" cy="50" r="1.5" fill="#c026d3"/>
        <circle cx="95" cy="46" r="1.5" fill="#c026d3"/>
        <circle cx="80" cy="56" r="1.5" fill="#c026d3"/>
        <!-- View B points (Yellow/Amber) -->
        <circle cx="108" cy="40" r="1.5" fill="#facc15"/>
        <circle cx="122" cy="48" r="1.5" fill="#facc15"/>
        <circle cx="135" cy="42" r="1.5" fill="#facc15"/>
        <circle cx="115" cy="54" r="1.5" fill="#facc15"/>
        <circle cx="140" cy="58" r="1.5" fill="#facc15"/>
        <circle cx="128" cy="62" r="1.5" fill="#facc15"/>
      </g>
    </g>

    <!-- Concise Descriptors -->
    <text x="20" y="142" class="label-dim">&#8226; Dense Unprojection: K^-1 &#183; Depth</text>
    <text x="20" y="162" class="label-dim">&#8226; Metric Alignment: X_B = R X_A + &#955; t_unit</text>
    <text x="20" y="182" class="label-math">&#8226; Output: (M, 3) Fused PLY Model</text>
  </g>
</svg>