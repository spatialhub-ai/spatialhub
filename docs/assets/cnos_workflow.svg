<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" width="100%" height="100%">
  <defs>
    <style>
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: #94a3b8; }
      .label-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; fill: #f8fafc; }
      .label-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #94a3b8; }
      .label-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #38bdf8; }
      .label-math { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.2px; fill: #34d399; }
      .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.2px; fill: #fbbf24; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1180" height="270" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Title -->
  <text x="25" y="27" class="label-title">CNOS (CAD-Based Novel Object Segmentation) Pipeline</text>

  <!-- Stage 1: CAD Rendering & Template Caching (x: 25, w: 200) -->
  <g transform="translate(25, 44)">
    <rect width="200" height="202" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="200" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">CAD Template Caching</text>

    <!-- Mesh icon box -->
    <g transform="translate(16, 42)">
      <rect width="168" height="42" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="label-dim">3D CAD (.ply / .obj / .stl)</text>
      <text x="10" y="33" class="label-math">Unit scaling: model_unit="mm"</text>
    </g>

    <text x="100" y="112" class="label-body" text-anchor="middle">Spherical Viewpoint Sampling</text>
    <text x="100" y="128" class="label-dim" text-anchor="middle">M = 42 viewpoints on sphere</text>
    <text x="100" y="150" class="label-body" text-anchor="middle">DINOv2 Feature Caching</text>
    <text x="100" y="166" class="label-math" text-anchor="middle">F_ref = L2_norm(CLS_token)</text>
    <text x="100" y="186" class="label-dim" text-anchor="middle">Cached Matrix: (M, D)</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(236, 145)">
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="7,-3 13,0 7,3" fill="#38bdf8"/>
  </g>

  <!-- Stage 2: Proposal Generation (x: 250, w: 205) -->
  <g transform="translate(250, 44)">
    <rect width="205" height="202" rx="8" fill="#182234" stroke="#2563eb" stroke-width="1.2"/>
    <rect width="205" height="30" rx="8" fill="#1e3a8a" opacity="0.6"/>
    <rect y="22" width="205" height="8" fill="#1e3a8a" opacity="0.6"/>
    <text x="12" y="20" class="label-header">Scene Proposal Segmentor</text>

    <!-- Segmentor Selection Box -->
    <g transform="translate(18, 42)">
      <rect width="169" height="46" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="84" y="20" class="label-header" text-anchor="middle" fill="#38bdf8">Pluggable Segmentor</text>
      <text x="84" y="37" class="label-dim" text-anchor="middle">FastSAM-x / FastSAM-s | SAM</text>
    </g>

    <text x="102" y="114" class="label-body" text-anchor="middle">Class-Agnostic Mask Proposals</text>
    <text x="102" y="132" class="label-dim" text-anchor="middle">K spatial candidate segments</text>
    <text x="102" y="152" class="label-math" text-anchor="middle">conf_thresh=0.05, iou=0.90</text>
    <text x="102" y="174" class="label-body" text-anchor="middle">Output Masks &amp; Boxes:</text>
    <text x="102" y="192" class="label-dim" text-anchor="middle">(K, H_orig, W_orig) &amp; (K, 4)</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(466, 145)">
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="7,-3 13,0 7,3" fill="#38bdf8"/>
  </g>

  <!-- Stage 3: Proposal Cropping & Descriptors (x: 480, w: 220) -->
  <g transform="translate(480, 44)">
    <rect width="220" height="202" rx="8" fill="#182234" stroke="#38bdf8" stroke-width="1"/>
    <rect width="220" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="220" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">Proposal Descriptor Extraction</text>

    <!-- Descriptor Box -->
    <g transform="translate(14, 42)">
      <rect width="192" height="42" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="label-dim">DINOv2 (vitl14 / vitb14 / vits14)</text>
      <text x="10" y="33" class="label-math">L2-Normalized CLS Embedding (D)</text>
    </g>

    <text x="110" y="112" class="label-body" text-anchor="middle">Mask-Guided Patch Cropping</text>
    <text x="110" y="128" class="label-dim" text-anchor="middle">crop = image * mask[bbox]</text>
    <text x="110" y="150" class="label-body" text-anchor="middle">Square Padding &amp; Normalization</text>
    <text x="110" y="166" class="label-math" text-anchor="middle">pad_to_square(crop) &#8594; 224x224</text>
    <text x="110" y="188" class="label-dim" text-anchor="middle">F_scene: (K, D) float32</text>
  </g>

  <!-- Flow Arrow 3 -->
  <g transform="translate(711, 145)">
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="7,-3 13,0 7,3" fill="#38bdf8"/>
  </g>

  <!-- Stage 4: Cosine Matching & Top-K (x: 725, w: 220) -->
  <g transform="translate(725, 44)">
    <rect width="220" height="202" rx="8" fill="#182234" stroke="#34d399" stroke-width="1"/>
    <rect width="220" height="30" rx="8" fill="#064e3b" opacity="0.6"/>
    <rect y="22" width="220" height="8" fill="#064e3b" opacity="0.6"/>
    <text x="12" y="20" class="label-header">Cosine Matching &amp; Top-K</text>

    <text x="12" y="48" class="label-dim">1. Pairwise Cosine Matrix</text>
    <text x="20" y="64" class="label-math">S = F_scene &#64; F_ref.T  (K, M)</text>

    <text x="12" y="86" class="label-dim">2. Top-K Viewpoint Mean</text>
    <text x="20" y="102" class="label-math">score_i = mean(TopK(S_i, k=5))</text>

    <text x="12" y="124" class="label-dim">3. Confidence Thresholding</text>
    <text x="20" y="140" class="label-body">Filter candidates: score &gt; tau_conf</text>

    <text x="12" y="162" class="label-dim">4. Post-Matching Box NMS</text>
    <text x="20" y="178" class="code-amber">nms_boxes(boxes, scores, tau_nms)</text>
    <text x="20" y="194" class="label-dim">Sort descending: top num_max_dets</text>
  </g>

  <!-- Flow Arrow 4 -->
  <g transform="translate(956, 145)">
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="7,-3 13,0 7,3" fill="#38bdf8"/>
  </g>

  <!-- Stage 5: Output Data Contract (x: 970, w: 185) -->
  <g transform="translate(970, 44)">
    <rect width="185" height="202" rx="8" fill="#182234" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="185" height="30" rx="8" fill="#1e293b"/>
    <rect y="22" width="185" height="8" fill="#1e293b"/>
    <text x="12" y="20" class="label-header">Output Data Contract</text>

    <!-- Dataclass box -->
    <g transform="translate(12, 40)">
      <rect width="161" height="24" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <text x="80" y="16" class="label-dim" text-anchor="middle">InstanceSegmentation</text>
    </g>

    <!-- Field Descriptions -->
    <g transform="translate(16, 76)">
      <text x="0" y="0" class="label-header" fill="#f8fafc">Fields:</text>

      <text x="4" y="15" class="label-dim">&#8226; masks</text>
      <text x="14" y="27" class="label-body">(N, H, W) bool</text>

      <text x="4" y="42" class="label-dim">&#8226; boxes</text>
      <text x="14" y="54" class="label-body">(N, 4) float32</text>

      <text x="4" y="69" class="label-dim">&#8226; scores</text>
      <text x="14" y="81" class="label-body">(N,) float32 in [0, 1]</text>

      <text x="4" y="96" class="label-dim">&#8226; names</text>
      <text x="14" y="108" class="label-body">list[str] (object_name)</text>
    </g>
  </g>
</svg>
