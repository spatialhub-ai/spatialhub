site_name: SpatialHub
site_description: Zero-PyTorch Python library for composing deep vision models and geometric algorithms into spatial perception pipelines.
site_url: https://spatialhub-ai.github.io/spatialhub/
repo_url: https://github.com/spatialhub-ai/spatialhub
repo_name: spatialhub-ai/spatialhub
copyright: 'Built by <a href="https://github.com/pankajkaushik12">Pankaj Kaushik</a> • <a href="https://github.com/spatialhub-ai/spatialhub">GitHub Repo</a>'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spatialhub-ai/spatialhub
      name: SpatialHub on GitHub
    - icon: fontawesome/solid/user
      link: https://github.com/pankajkaushik12
      name: Pankaj Kaushik on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:pankajkaushik12r@gmail.com
      name: Contact Author via Email

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quickstart: getting_started/quickstart.md
  - Structures:
      - Poses & Cameras: structures/poses_and_cameras.md
      - Perception: structures/perception_primitives.md
      - Scene & Depth: structures/scene_and_bounds.md
  - Utilities:
      - Images: utilities/image.md
      - Transforms: utilities/transform.md
      - Cameras: utilities/camera.md
      - Meshes: utilities/mesh.md
      - Visualization: utilities/visualization.md
  - Rendering:
      - Headless Contexts: rendering/headless.md
      - Atlas Renderer: rendering/atlas_renderer.md
      - Fullscreen Shaders: rendering/fullscreen_shaders.md
  - Model Adapters:
      - Overview: models/overview.md
      - EfficientLoFTR: models/eloftr.md
      - Depth Anything 3: models/depthanything3.md
      - DINOv2: models/dinov2.md
      - FastSAM: models/fastsam.md
      - SAM: models/sam.md
      - CNOS: models/cnos.md
      - FoundationPose: models/foundationpose.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
