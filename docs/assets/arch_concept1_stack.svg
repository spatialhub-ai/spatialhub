<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="layerPill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="14" fill="url(#bgPlate)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Layer: User Space Applications -->
  <g transform="translate(40, 36)">
    <rect width="880" height="68" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="24" y="32" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="sans-serif">APPLICATION WORKFLOWS (USER COMPOSED)</text>
    <g transform="translate(24, 38)">
      <rect x="0" y="0" width="260" height="22" rx="4" fill="#0f172a" opacity="0.6"/>
      <text x="130" y="15" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">Visual Odometry &amp; SLAM</text>

      <rect x="280" y="0" width="260" height="22" rx="4" fill="#0f172a" opacity="0.6"/>
      <text x="410" y="15" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">6D Object Pose Tracking</text>

      <rect x="560" y="0" width="270" height="22" rx="4" fill="#0f172a" opacity="0.6"/>
      <text x="695" y="15" fill="#f8fafc" font-size="11" font-family="sans-serif" text-anchor="middle">3D Reconstruction &amp; CAD Matching</text>
    </g>
  </g>

  <!-- Layer 3: Spatial Solvers & Offscreen Rendering -->
  <g transform="translate(40, 124)">
    <rect width="880" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="sans-serif">SPATIAL UTILITIES &amp; RENDERING (ALGORITHMIC CORE)</text>
    <g transform="translate(24, 34)">
      <!-- Left Box: Geometric Solvers -->
      <rect x="0" y="0" width="410" height="30" rx="5" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#3b82f6"/>
      <text x="30" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif">Geometric Solvers &amp; SE(3) Transformations</text>
      <text x="390" y="19" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="end">PnP • Epipolar • Mesh</text>

      <!-- Right Box: Offscreen Rendering -->
      <rect x="430" y="0" width="400" height="30" rx="5" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <circle cx="446" cy="15" r="4" fill="#38bdf8"/>
      <text x="460" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif">Offscreen Rendering &amp; Shaders</text>
      <text x="815" y="19" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="end">ModernGL • Fullscreen Passes</text>
    </g>
  </g>

  <!-- Layer 2: Standardized Spatial Structures -->
  <g transform="translate(40, 218)">
    <rect width="880" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="24" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="sans-serif">SPATIAL STRUCTURES (OPENCV COORDINATE DATA CONTRACTS)</text>
    <g transform="translate(24, 34)">
      <rect x="0" y="0" width="265" height="30" rx="5" fill="#0f172a" stroke="#1d4ed8" stroke-width="1"/>
      <text x="132" y="19" fill="#f1f5f9" font-size="11.5" font-family="sans-serif" text-anchor="middle">RigidTransform3D • CameraIntrinsics</text>

      <rect x="282" y="0" width="265" height="30" rx="5" fill="#0f172a" stroke="#1d4ed8" stroke-width="1"/>
      <text x="414" y="19" fill="#f1f5f9" font-size="11.5" font-family="sans-serif" text-anchor="middle">KeypointMatches • SegmentProposals</text>

      <rect x="564" y="0" width="266" height="30" rx="5" fill="#0f172a" stroke="#1d4ed8" stroke-width="1"/>
      <text x="697" y="19" fill="#f1f5f9" font-size="11.5" font-family="sans-serif" text-anchor="middle">MetricDepthMap • PointCloud3D</text>
    </g>
  </g>

  <!-- Layer 1: Neural Inference Adapters -->
  <g transform="translate(40, 312)">
    <rect width="880" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="24" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="sans-serif">NEURAL INFERENCE ADAPTERS (ISOLATED ONNX RUNTIME SESSIONS)</text>
    <g transform="translate(24, 34)">
      <rect x="0" y="0" width="195" height="30" rx="5" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
      <text x="97" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif" text-anchor="middle">Depth Estimation</text>

      <rect x="210" y="0" width="195" height="30" rx="5" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
      <text x="307" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif" text-anchor="middle">Feature Matching</text>

      <rect x="420" y="0" width="200" height="30" rx="5" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
      <text x="520" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif" text-anchor="middle">Instance Segmentation</text>

      <rect x="635" y="0" width="195" height="30" rx="5" fill="#0f172a" stroke="#4f46e5" stroke-width="1"/>
      <text x="732" y="19" fill="#e2e8f0" font-size="11.5" font-family="sans-serif" text-anchor="middle">Pose Estimation</text>
    </g>
  </g>

  <!-- Base Foundation Layer -->
  <g transform="translate(40, 404)">
    <rect width="880" height="46" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="1" stroke-dasharray="4 2"/>
    <g transform="translate(30, 28)">
      <circle cx="0" cy="-4" r="3" fill="#22c55e"/>
      <text x="12" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif">Hardware Execution Providers (CUDA, TensorRT, CPU)</text>

      <circle cx="360" cy="-4" r="3" fill="#3b82f6"/>
      <text x="372" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif">OpenCV Coordinate Convention (+X Right, +Y Down, +Z Forward)</text>

      <circle cx="740" cy="-4" r="3" fill="#38bdf8"/>
      <text x="752" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif">NumPy Tensor Interop</text>
    </g>
  </g>
</svg>
