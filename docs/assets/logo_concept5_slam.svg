<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Depth Gradient along trajectory -->
    <linearGradient id="slamPathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="planeGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="planeGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="planeGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- 3D Feature Landmark Point Cloud (Background Reconstructed Map) -->
  <circle cx="58" cy="22" r="1.6" fill="#93c5fd" opacity="0.6"/>
  <circle cx="68" cy="26" r="2.2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="76" cy="18" r="1.8" fill="#60a5fa" opacity="0.5"/>
  <circle cx="84" cy="30" r="2.2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="52" cy="34" r="1.6" fill="#93c5fd" opacity="0.5"/>

  <!-- Smooth Camera Trajectory Path Spline -->
  <path d="M 18 78 Q 36 68, 44 48 T 78 36" fill="none" stroke="url(#slamPathGrad)" stroke-width="2.5" stroke-dasharray="4 2.5"/>

  <!-- Keyframe 1: (18, 78) - Starting Pose -->
  <line x1="18" y1="78" x2="30" y2="68" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="18" y1="78" x2="36" y2="76" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <polygon points="30,68 36,76 34,84 28,76" fill="url(#planeGradA)" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="18" cy="78" r="3.2" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Keyframe 2: (44, 48) - Intermediate Tracking Pose -->
  <line x1="44" y1="48" x2="56" y2="38" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <line x1="44" y1="48" x2="64" y2="44" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  <polygon points="56,38 64,44 60,54 52,48" fill="url(#planeGradB)" stroke="#0284c7" stroke-width="1.2"/>
  <circle cx="44" cy="48" r="3.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Keyframe 3: (78, 36) - Active Front-End Pose -->
  <line x1="78" y1="36" x2="88" y2="22" stroke="#22c55e" stroke-width="1.2" opacity="0.8"/>
  <line x1="78" y1="36" x2="94" y2="30" stroke="#22c55e" stroke-width="1.2" opacity="0.8"/>
  <polygon points="88,22 94,30 90,40 84,32" fill="url(#planeGradC)" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="78" cy="36" r="4.2" fill="#22c55e" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Epipolar Triangulation Rays to Map Landmark (68, 26) -->
  <line x1="18" y1="78" x2="68" y2="26" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2 2" opacity="0.35"/>
  <line x1="44" y1="48" x2="68" y2="26" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7"/>
  <line x1="78" y1="36" x2="68" y2="26" stroke="#4ade80" stroke-width="1.4" stroke-dasharray="2 2" opacity="0.85"/>

  <!-- Target Triangulated Map Landmark Focus Ring -->
  <circle cx="68" cy="26" r="5" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="2 1.5"/>
</svg>
