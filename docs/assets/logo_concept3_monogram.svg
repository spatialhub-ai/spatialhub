<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sGradDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Clean Precision Geometry Monogram 'S' -->
  <!-- Top Horizontal Bar -->
  <path d="M 28 24 L 72 24 L 64 36 L 28 36 Z" fill="url(#sGradTop)" stroke="#2563eb" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Top-to-Center Left Wing -->
  <path d="M 28 36 L 40 36 L 32 50 L 20 50 Z" fill="url(#sGradTop)" opacity="0.95"/>

  <!-- Center Bridge -->
  <path d="M 32 50 L 68 50 L 76 62 L 40 62 Z" fill="url(#sGradDiag)" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Bottom-to-Right Wing -->
  <path d="M 68 50 L 80 50 L 72 64 L 60 64 Z" fill="url(#sGradDiag)" opacity="0.95"/>
  <!-- Bottom Horizontal Bar -->
  <path d="M 28 64 L 72 64 L 64 76 L 20 76 Z" fill="url(#sGradBottom)" stroke="#1e40af" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Coordinate Reference Nodes (Visualizing Spatial Calibration) -->
  <circle cx="28" cy="24" r="3" fill="#ef4444"/>
  <circle cx="72" cy="24" r="3" fill="#3b82f6"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="20" cy="76" r="3" fill="#22c55e"/>
  <circle cx="64" cy="76" r="3" fill="#3b82f6"/>
</svg>
