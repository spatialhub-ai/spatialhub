<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="frustumGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Rays from Camera Origin (18, 50) to Frustum Plane -->
  <line x1="18" y1="50" x2="62" y2="24" stroke="url(#rayGrad)" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>
  <line x1="18" y1="50" x2="88" y2="34" stroke="url(#rayGrad)" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>
  <line x1="18" y1="50" x2="88" y2="68" stroke="url(#rayGrad)" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>
  <line x1="18" y1="50" x2="62" y2="78" stroke="url(#rayGrad)" stroke-width="2" stroke-dasharray="3 2" opacity="0.8"/>

  <!-- Frustum Image Plane Quad -->
  <polygon points="62,24 88,34 88,68 62,78" fill="url(#frustumGrad1)" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Image Plane Grid / Sensor Reticle -->
  <line x1="75" y1="29" x2="75" y2="73" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="62" y1="51" x2="88" y2="51" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Camera Optical Origin / Center of Projection -->
  <circle cx="18" cy="50" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Orthogonal Coordinate Triad at Origin -->
  <!-- X: Right (Red) -->
  <line x1="18" y1="50" x2="36" y2="58" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Y: Down (Green) -->
  <line x1="18" y1="50" x2="18" y2="72" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Z: Forward Optical Axis (Blue) -->
  <line x1="18" y1="50" x2="38" y2="40" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
